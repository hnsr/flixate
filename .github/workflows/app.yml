name: Deploy Flixate app

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Find the latest successful catalog refresh
        id: catalog-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/catalog.yml/runs" \
            -f branch=main \
            -f status=success \
            -f per_page=1 \
            --jq '.workflow_runs[0].id')"
          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "No successful catalog refresh is available." >&2
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download the latest catalog snapshot
        uses: actions/download-artifact@v5
        with:
          name: flixate-catalog-${{ steps.catalog-run.outputs.run-id }}
          path: public/data/live
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.catalog-run.outputs.run-id }}
      - name: Validate the downloaded catalog snapshot
        run: npm run catalog:validate
      - run: npm test
      - run: npm run typecheck
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build the production app against the snapshot
        env:
          VITE_CATALOG_MANIFEST_URL: data/live/manifest.json
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
