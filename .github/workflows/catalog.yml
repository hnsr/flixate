name: Deploy Flixate

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@v4
        id: tmdb-cache
        with:
          path: .cache/phase0
          key: tmdb-discovery-${{ github.run_id }}
      - name: Build and validate US+NL snapshot
        run: npm run catalog -- --resume-cache
      - uses: actions/cache/save@v4
        if: always() && steps.tmdb-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/phase0
          key: tmdb-discovery-${{ github.run_id }}
      - run: npm test
      - run: npm run typecheck
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build the production app against the snapshot
        env:
          VITE_CATALOG_MANIFEST_URL: data/live/manifest.json
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: flixate-catalog-${{ github.run_id }}
          path: public/data/live/
          if-no-files-found: error
          retention-days: 14
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
